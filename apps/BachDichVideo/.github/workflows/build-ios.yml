name: Build Bach Dich Video iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile, test and package
        run: bash Scripts/build_unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BachDichVideo-v0.1.1-UNSIGNED
          path: build/BachDichVideo_v0.1.1_UNSIGNED.ipa
          if-no-files-found: error
