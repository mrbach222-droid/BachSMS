name: BachCRMMobile
options:
  bundleIdPrefix: vn.bachcrm
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  BachCRMMobile:
    type: application
    platform: iOS
    sources:
      - BachCRMMobile
    info:
      path: BachCRMMobile/Info.plist
      properties:
        CFBundleDisplayName: Bách CRM
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.bachcrm.mobile
        INFOPLIST_KEY_CFBundleDisplayName: 'Bách CRM'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: 'NO'