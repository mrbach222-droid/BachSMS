name: Build Bách SMS Android APK

on:
  push:
    branches: [bachsms-crm-sync-v1.1.0]
    paths:
      - "BachSMSAndroid/**"
      - ".github/workflows/build-bachsms-android.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build installable debug APK
        working-directory: BachSMSAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Package APK
        run: |
          mkdir -p BachSMSAndroid/dist
          cp BachSMSAndroid/app/build/outputs/apk/debug/app-debug.apk BachSMSAndroid/dist/BachSMS_Android_v1.0.0_CRM_AutoSMS.apk
          sha256sum BachSMSAndroid/dist/BachSMS_Android_v1.0.0_CRM_AutoSMS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BachSMS-Android-v1.0.0-CRM-AutoSMS
          path: BachSMSAndroid/dist/BachSMS_Android_v1.0.0_CRM_AutoSMS.apk
          if-no-files-found: error
          retention-days: 30
