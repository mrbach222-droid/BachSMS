name: Build B Send v0.3 LAN iOS IPA
on:
  push:
    branches:
      - bachsend-lan-v03
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Generate native project and B Send icon
        working-directory: BachSendStandalone
        run: |
          brew install xcodegen
          python3 generate_icon.py
          xcodegen generate
      - name: Compile SwiftUI app
        working-directory: BachSendStandalone
        run: |
          xcodebuild -project BachSend.xcodeproj -scheme BachSend -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA and validate archive
        working-directory: BachSendStandalone
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BachSend.app Payload/
          test -f Payload/BachSend.app/BachSend
          test -f Payload/BachSend.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/BachSend.app/Info.plist
          zip -qry BachSend-v0.3-LAN-unsigned.ipa Payload
          unzip -t BachSend-v0.3-LAN-unsigned.ipa | tail -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: BachSend-v0.3-LAN-unsigned
          path: BachSendStandalone/BachSend-v0.3-LAN-unsigned.ipa
          retention-days: 30
