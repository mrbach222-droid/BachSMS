name: Build B Send v0.6.4 Smart Resume SHA-256 IPA
on:
  push:
    branches: [bachsend-v064-smart-resume-sha256]
    paths:
      - 'BachSendStandalone/**'
      - '.github/workflows/build-bachsend-v064.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native project
        working-directory: BachSendStandalone
        run: |
          brew install xcodegen
          python3 generate_icon.py
          xcodegen generate
      - name: Compile native B Send app
        working-directory: BachSendStandalone
        run: |
          xcodebuild -project BachSend.xcodeproj -scheme BachSend -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify packaged IPA
        working-directory: BachSendStandalone
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BachSend.app Payload/
          test -f Payload/BachSend.app/BachSend
          test -f Payload/BachSend.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryAddUsageDescription' Payload/BachSend.app/Info.plist
          zip -qry BachSend-v0.6.4-SmartResume-SHA256-unsigned.ipa Payload
          unzip -t BachSend-v0.6.4-SmartResume-SHA256-unsigned.ipa | tail -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: BachSend-v0.6.4-SmartResume-SHA256-unsigned
          path: BachSendStandalone/BachSend-v0.6.4-SmartResume-SHA256-unsigned.ipa
          retention-days: 30
