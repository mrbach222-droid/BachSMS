name: Build B Find OCR v0.2.1
on:
  push:
    branches: [bachfind-ocr-v021]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare iOS app
        working-directory: BachFindStandalone
        run: |
          brew install xcodegen
          python3 generate_icon.py
          xcodegen generate
      - name: Compile native
        working-directory: BachFindStandalone
        run: |
          xcodebuild -project BachFind.xcodeproj -scheme BachFind -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package and verify IPA
        working-directory: BachFindStandalone
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BachFind.app Payload/
          test -f Payload/BachFind.app/BachFind
          zip -qry BachFind-v0.2.1-OCR-fix-unsigned.ipa Payload
          unzip -t BachFind-v0.2.1-OCR-fix-unsigned.ipa | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: BachFind-v0.2.1-OCR-fix-unsigned
          path: BachFindStandalone/BachFind-v0.2.1-OCR-fix-unsigned.ipa
          retention-days: 30
