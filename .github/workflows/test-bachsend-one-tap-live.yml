name: Live B Send v0.5.2 One Tap
on:
  push:
    branches: [bachsend-v052-one-tap]
    paths:
      - 'BachSendCloudflare/test/live-one-tap-v052.mjs'
      - '.github/workflows/test-bachsend-one-tap-live.yml'
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test current Cloudflare deployment and one-tap pairing
        run: node BachSendCloudflare/test/live-one-tap-v052.mjs
