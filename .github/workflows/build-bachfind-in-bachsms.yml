name: Build Bach Find IPA on BachSMS runner
on:
  push:
    branches:
      - bachsend-v01-build
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        working-directory: BachFindStandalone
        run: |
          python3 generate_icon.py
          brew install xcodegen
          xcodegen generate
      - name: Build
        working-directory: BachFindStandalone
        run: |
          xcodebuild -project BachFind.xcodeproj -scheme BachFind -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Create IPA
        working-directory: BachFindStandalone
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BachFind.app Payload/
          zip -qry BachFind-v0.1-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BachFind-v0.1-unsigned
          path: BachFindStandalone/BachFind-v0.1-unsigned.ipa
          retention-days: 30
