name: Validate B Send v0.4 Relay
on:
  push:
    branches: [bachsend-hybrid-v04]
    paths:
      - 'BachSendCloudflare/**'
      - '.github/workflows/test-bachsend-relay-v04.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BachSendCloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and browser integration
        run: npm test
      - name: Validate Wrangler configuration and Durable Object binding
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir ./dist
