name: B Send v0.4 Live Relay Smoke Test
on:
  push:
    branches: [bachsend-hybrid-v04]
    paths:
      - 'BachSendCloudflare/test/live-relay.mjs'
      - '.github/workflows/test-bachsend-live-v04.yml'
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare Worker live pairing and encrypted transport
        run: node BachSendCloudflare/test/live-relay.mjs
