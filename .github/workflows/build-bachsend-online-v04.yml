name: Build B Send v0.4 Online iOS IPA
on:
  push:
    branches: [bachsend-hybrid-v04]
    paths:
      - 'BachSendStandalone/**'
      - '.github/workflows/build-bachsend-online-v04.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Generate native iOS project
        working-directory: BachSendStandalone
        run: |
          brew install xcodegen
          python3 generate_icon.py
          xcodegen generate
      - name: Compile native iOS release
        working-directory: BachSendStandalone
        run: |
          xcodebuild -project BachSend.xcodeproj -scheme BachSend -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify package contents
        working-directory: BachSendStandalone
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BachSend.app Payload/
          test -f Payload/BachSend.app/BachSend
          test -f Payload/BachSend.app/Info.plist
          test -f Payload/BachSend.app/Assets.car
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/BachSend.app/Info.plist
          zip -qry BachSend-v0.4-Online-preview-unsigned.ipa Payload
          unzip -t BachSend-v0.4-Online-preview-unsigned.ipa | tail -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: BachSend-v0.4-Online-preview-unsigned
          path: BachSendStandalone/BachSend-v0.4-Online-preview-unsigned.ipa
          retention-days: 30
