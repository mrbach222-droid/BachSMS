name: Live B Send v0.6.6 Safari Offline Recovery
on:
  push:
    branches: [bachsend-v066-reliable-receive-media]
    paths:
      - '.github/workflows/test-bachsend-live-v066.yml'
  workflow_dispatch:
jobs:
  safari-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BachSendCloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps webkit
      - name: Wait for Cloudflare v0.6.6 deployment
        run: |
          node --input-type=module <<'NODE'
          const url="https://bachsend-relay.mrbach222.workers.dev/";
          let ready=false;
          for(let i=0;i<55;i++){
            try{
             const r=await fetch(url,{cache:"no-store",headers:{"Cache-Control":"no-cache"}});
             const h=await r.text();
             if(r.ok&&h.includes("bsend.local-received.v066")&&
                h.includes("saveIntoPhotos(")&&
                h.includes("checkOwnerRoom(")&&
                h.includes("restoreReceivedFiles()")&&
                h.includes("Safari quota is shared")&&
                !h.includes("Dọn dữ liệu xem trước sau 15 phút")){
               ready=true;console.log("PASS Cloudflare v0.6.6 reliable receive deployed");break;
             }
            }catch(e){console.log(e.message)}
            await new Promise(r=>setTimeout(r,4000));
          }
          if(!ready)process.exit(1);
          NODE
      - name: Verify live Safari photo persists while iPhone owner is offline and page reloads
        env:
          BSEND_BASE: https://bachsend-relay.mrbach222.workers.dev
        run: node test/safari-receive-v066.mjs
      - name: Validate two isolated private iPhone rooms on live Cloudflare
        env:
          BSEND_BASE: https://bachsend-relay.mrbach222.workers.dev
        run: node test/multi-device-v060.mjs
      - name: Verify live iOS stale owner takeover and Safari guest continuity
        env:
          BSEND_BASE: https://bachsend-relay.mrbach222.workers.dev
        run: node test/owner-reconnect-v066.mjs
