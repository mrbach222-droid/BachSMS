name: BachFind
options:
  projectFormat: xcode15_3
  xcodeVersion: '15.4'
  bundleIdPrefix: com.mrbach222
  deploymentTarget:
    iOS: "17.0"
targets:
  BachFind:
    type: application
    platform: iOS
    sources:
      - path: BachFind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrbach222.BachFind
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Bách Find"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Bách Find nhận dạng chữ trong ảnh trên iPhone để tìm kiếm, không tải ảnh lên mạng."
