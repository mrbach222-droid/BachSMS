plugins {
    id "com.android.application"
}

android {
    namespace "com.bach.sms"
    compileSdk 35

    defaultConfig {
        applicationId "com.bach.sms"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.2.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

