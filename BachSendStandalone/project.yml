name: BachSend
options:
  projectFormat: xcode15_3
  xcodeVersion: '15.4'
  bundleIdPrefix: com.mrbach222
  deploymentTarget:
    iOS: "17.0"
targets:
  BachSend:
    type: application
    platform: iOS
    sources:
      - path: BachSend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrbach222.BachSend
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Bách Send"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Bách Send dùng Wi-Fi nội bộ để chuyển tệp giữa các thiết bị bạn cho phép."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
